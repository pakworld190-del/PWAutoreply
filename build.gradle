plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
}

android {
    namespace "com.abubakarsaddiq.profreelancer.autorepy"
    compileSdk 35

    defaultConfig {
        applicationId "com.abubakarsaddiq.profreelancer.autorepy"
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        debug {
            debuggable true
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    // Intentionally empty: only the Android SDK and Kotlin plugin are used.
}